name: Actualizar precios

on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"   # cada 10 minutos, lunes a viernes, 10:00 a 18:59 hora de Argentina
  workflow_dispatch:                # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar precios
        run: python actualizar_datos.py
      - name: Guardar datos.json si cambio
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add datos.json
          [ -f historico.json ] && git add historico.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Precios $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
